# Configuration du serveur local de SHOT (sidecar/serveur.py).
# Aucun chemin d'utilisateur ici : SHOT passe le dossier des modèles en argument (--racine), ou la
# variable d'environnement SHOT_MODELES le donne. Les arguments l'emportent sur ce fichier.

[modeles]
# racine = ""          # dossier SHOT-modeles ; ses modèles sont dans <racine>/modeles
# dossier = ""         # ou : le dossier qui contient directement un dossier par modèle
lecture = "Qwen2.5-VL-7B-Instruct-AWQ"
voix = "Kokoro-82M"
son = "stable-audio-open-small"      # model_config.json + model.safetensors (stable-audio-tools)
t5 = "t5-base"                       # google-t5/t5-base : l'encodeur de texte de Stable Audio

[voix]
defaut = "ff_siwis"                  # la voix quand SHOT n'en demande pas

[lecture]
max_tokens = 300                     # longueur maximale de la réponse d'un plan

[serveur]
# port = 8765
decharger_apres_s = 600              # rend la mémoire graphique après 10 minutes sans demande (0 : jamais)
