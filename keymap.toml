# Raccourcis clavier de SHOT
#
# Chaque bloc [[raccourci]] associe une ou plusieurs touches à une action (identifiant stable).
#
# Pour personnaliser : « Fichier > Préférences… > Raccourcis clavier > Modifier le fichier à la main »
# (ou l'icône crayon de la liste « Aide > Raccourcis clavier… », F1) crée une copie de ce fichier dans
# %APPDATA%\SHOT\keymap.toml et l'ouvre. Ne gardez-y que les actions que vous changez si vous
# voulez : chaque action redéfinie remplace celle d'ici, les autres restent par défaut.
# Puis « Recharger » (même endroit, ou relancez SHOT). touches = [] retire un raccourci.
# Le plus simple reste le clic droit sur une icône ou une entrée de menu : « Assigner un raccourci… ».
#
# Deux actions ne peuvent pas avoir la même touche dans le même contexte, même « en réserve » :
# l'essai keymap_tests::no_two_default_bindings_share_a_key_in_the_same_context le vérifie.
#
# Écriture des touches : modificateurs Ctrl, Maj (ou Shift), Alt, puis la touche, séparés par « + ».
#   Exemples : "Ctrl+Z", "Ctrl+Maj+Z", "Alt+B", "F5", "Entrée", "Suppr", "Échap", "Espace", "+".
#   Lettres : c'est la lettre tapée qui compte (en AZERTY, "Q" est la touche marquée Q).
#   Chiffres et ponctuation : c'est la POSITION de la touche qui compte, nommée comme sur un clavier
#   QWERTY. En AZERTY : "," = touche ;   "." = touche :   "[" = touche ^   "]" = touche $
#   "-" = touche )   "1" = touche &/1 (sans Maj). "+" accepte aussi le + du pavé numérique.
#   Pour forcer : "car:," (le caractère virgule) ou "pos:A" (la position du A d'un QWERTY).
#
# contexte = "storyboard" ou "animation" : le raccourci ne vaut que dans ce mode.
# etat = "non implémenté" : gardé en réserve, la fonction n'existe pas encore dans SHOT.
# etat = "désactivé" : le raccourci est ignoré.
# source : d'où vient le raccourci.
#   « Storyboard Pro 27 » = raccourci par défaut lu dans sb_shortcuts.xml de Storyboard Pro 27 ;
#   « perso » = vos réglages (STB_Shortcuts.xml) ; « proposition » = proposé par SHOT, à valider ;
#   « TVPaint 12 (perso) » = vos raccourcis TVPaint 12 (config.ini, section [keyboard]).

