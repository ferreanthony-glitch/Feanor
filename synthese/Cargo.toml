[package]
name = "synthese"
version = "0.1.0"
edition = "2021"
description = "Synthèse d'image par l'exemple pour Pelure : portage en Rust d'ebsynth (version processeur)"

# Projet Cargo à part (son propre Cargo.lock et son dossier target), comme src-tauri/ : Pelure
# l'utilisera par son chemin quand la propagation arrivera dans l'interface.
[workspace]

# Sans la fonction « gpu », aucune dépendance : la bibliothèque ne travaille que sur des tampons
# d'octets. Avec (étape d), la synthèse sur la carte graphique : wgpu 24, la version de Pelure
# (eframe 0.31), pour pouvoir partager son périphérique, avec les mêmes fonctions qu'egui-wgpu
# (Vulkan sous Windows, sans Direct3D 12).
[dependencies]
wgpu = { version = "24.0.5", default-features = false, features = ["wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[features]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

# Lecture et écriture des images, seulement pour les outils en ligne de commande (examples/) et les
# essais. JPEG : Pelure range les images des vidéos importées en JPEG (videos/<id>/000001.jpg…).
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Calcul pixel : même en debug on optimise, sinon les essais sur de vraies images durent des minutes.
[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
