[package]
name = "pelure"
version = "0.1.0"
edition = "2021"
description = "FEANOR — Forge your story. Storyboard et animation 2D image par image (anciennement Pelure)"

# 10a : Pelure est aussi une bibliothèque, utilisée par l'appli compagnon Tauri (src-tauri/) ;
# l'exécutable (src/main.rs) ne fait que la lancer. src-tauri/ est un projet Cargo à part (son
# propre Cargo.lock) : Tauri ne change aucune version des dépendances de Pelure.
[lib]
name = "pelure"
path = "src/lib.rs"

# Le logiciel s'appelle FEANOR (anciens noms : SHOT, Pelure ; `pelure::` reste le nom de la bibliothèque) :
# l'exécutable est `feanor.exe`.
[[bin]]
name = "feanor"
path = "src/main.rs"

[dependencies]
# « wgpu » : affichage par la carte graphique (Direct3D 12 / Vulkan) ; « glow » (OpenGL) reste en
# secours. Fonctions par défaut d'eframe, sauf l'accessibilité (accesskit) : elle plante quand un
# panneau devient flottant (5b, `Option::unwrap` dans accesskit_consumer 0.26).
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }
# Direct3D 12 sous Windows, en plus de Vulkan (même wgpu qu'eframe) : eframe sans fonctions par
# défaut ne l'active pas. Le pilote Vulkan garde ~2,6 Go de mémoire vive de plus (ENDURANCE.md §6.5).
wgpu = { version = "24", default-features = false, features = ["dx12"] }
# Fonctions par défaut de winit, qu'eframe active d'ordinaire avec les siennes (même version).
winit = "0.30"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Déjà utilisé par egui : envoyer les tuiles à la carte graphique sans les recopier.
bytemuck = "1"
toml = "0.8"
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis"] }
# Phase 5 (choix d'Anthony) : icônes Phosphor (police d'icônes, licence MIT) et panneaux que l'on
# glisse, range en onglets et aimante sur les bords (licence MIT). Versions faites pour egui 0.31.
egui-phosphor = "0.9"
# Texte (5d) : lecture des polices (noms, contours des lettres). Déjà utilisé par egui.
ttf-parser = "0.25"
egui_dock = "0.16"
# Lecture de XML en arbre (src/xml.rs : réglages Krita). Version déjà dans Cargo.lock.
quick-xml = "0.41"
# Import des brosses Krita (réglages compressés dans le PNG) et plus tard Procreate (zip).
# Version déjà dans Cargo.lock (par image / png) : rien n'est téléchargé.
flate2 = "1"
# Coller une image du presse-papiers de Windows. Version déjà dans Cargo.lock (egui-winit, avec la
# lecture d'images) : rien n'est téléchargé.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Propagation façon EbSynth : la caisse synthese/ (projet Cargo à part), synthèse sur la carte
# graphique avec wgpu 24, celui d'eframe : elle tourne sur le périphérique de l'affichage.
synthese = { path = "synthese", features = ["gpu"] }
# Logo et icône de FEANOR (`logo.rs`) : le dessin du logo, tracé en vecteur, est rasterisé une fois.
# Sans le format PNG (inutile ici) : seules des caisses déjà en cache sont tirées.
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

# `build.rs` dessine l'icône de feanor.exe avec le même code que l'application (src/logo.rs).
[build-dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

# Le dessin et la composition sont du calcul pixel : même en debug on optimise,
# sinon le pinceau rame.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
# Numéros de ligne dans la pile des rapports de plantage (`plantage.rs`) ; dans le .pdb à côté de
# l'exécutable, pas dans l'exécutable.
debug = "line-tables-only"
