[package]
name = "pelure"
version = "0.1.0"
edition = "2021"
description = "Logiciel d'animation 2D bitmap image par image, inspiré de TVPaint"

[dependencies]
# « wgpu » : affichage par la carte graphique (Direct3D 12 / Vulkan) ; « glow » (OpenGL, inclus par
# défaut) reste en secours.
eframe = { version = "0.31", features = ["wgpu"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Déjà utilisé par egui : envoyer les tuiles à la carte graphique sans les recopier.
bytemuck = "1"
toml = "0.8"
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis"] }
# Phase 5 (choix d'Anthony) : icônes Phosphor (police d'icônes, licence MIT) et panneaux que l'on
# glisse, range en onglets et aimante sur les bords (licence MIT). Versions faites pour egui 0.31.
egui-phosphor = "0.9"
egui_dock = { version = "0.16", features = ["serde"] }

# Le dessin et la composition sont du calcul pixel : même en debug on optimise,
# sinon le pinceau rame.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
